name: Dependency-free host tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  isolated-lcd-queue:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test isolated source using the runner's existing Node.js
        run: node --test tests/lcd-queue.test.cjs
